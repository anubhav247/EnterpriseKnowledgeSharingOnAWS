AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  EKS platform: the EKS console (setup page on S3 + CloudFront), its API
  (API Gateway with JWT sign-in + Lambda) and the build runner (CodeBuild)
  that installs and removes team stacks inside this account. One per account
  and region. Deploy it with platform/install.sh from AWS CloudShell, or as a
  CloudFormation quick-create link with ReleaseUrl set. Guide: docs/platform.md.

Parameters:
  AdminEmail:
    Description: >-
      Console sign-in Cognito: the first admin. Cognito e-mails a temporary
      password to it; the password is never shown anywhere else.
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  SignIn:
    Description: >-
      cognito = the stack makes a user pool, only admins you add can sign in.
      oidc = your company sign-in (Entra ID, Okta, ...): give OidcIssuer and
      OidcClientId of a single-page app (public client, PKCE) whose redirect URI is
      the ConsoleUrl output.
    Type: String
    Default: cognito
    AllowedValues: [cognito, oidc]
  OidcIssuer:
    Description: oidc only. Issuer URL, e.g. https://login.microsoftonline.com/<tenant>/v2.0
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[^\\s?#]+$"
  OidcClientId:
    Description: oidc only. The app's client id (public, never a secret).
    Type: String
    Default: ""
    AllowedPattern: "^[\\w.:/@-]*$"
  AdminClaim:
    Description: >-
      Optional. name=value a token must carry to use the console, e.g.
      groups=<admin group object id>. Empty = anyone your sign-in lets in.
    Type: String
    Default: ""
    AllowedPattern: "^$|^[\\w.:-]+=[^\\s]+$"
  TeamPrefix:
    Description: Start of every team stack name (team legal = <TeamPrefix>legal). The runner may only touch these.
    Type: String
    Default: eks-
    AllowedPattern: "^[a-z][a-z0-9-]{1,14}-$"
  ReleaseUrl:
    Description: >-
      Quick-create only: https URL of the release tar.gz (GitHub Release asset).
      Empty when platform/install.sh uploads the bundle itself.
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[^\\s]+\\.tar\\.gz$"
  ReleaseSha256:
    Description: Quick-create only. The sha256 published next to the tar.gz.
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9a-f]{64}$"
  CdkQualifier:
    Type: String
    Default: hnb659fds

Conditions:
  Cognito: !Equals [!Ref SignIn, cognito]
  HasRelease: !Not [!Equals [!Ref ReleaseUrl, ""]]

Rules:
  OidcNeedsIds:
    RuleCondition: !Equals [!Ref SignIn, oidc]
    Assertions:
      - Assert: !Not [!Equals [!Ref OidcIssuer, ""]]
        AssertDescription: SignIn oidc needs OidcIssuer
      - Assert: !Not [!Equals [!Ref OidcClientId, ""]]
        AssertDescription: SignIn oidc needs OidcClientId
  CognitoNeedsAdmin:
    RuleCondition: !Equals [!Ref SignIn, cognito]
    Assertions:
      - Assert: !Not [!Equals [!Ref AdminEmail, ""]]
        AssertDescription: SignIn cognito needs AdminEmail

Resources:
  # ------------------------------------------------------------ storage
  # The release bundle (release/eks.tar.gz) and one folder of records per team.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags: [{ Key: eks-platform, Value: !Ref AWS::StackName }]

  BucketTls:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt Bucket.Arn, !Sub "${Bucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # The built setup page. Private: only CloudFront reads it.
  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags: [{ Key: eks-platform, Value: !Ref AWS::StackName }]

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${ConsoleBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt ConsoleBucket.Arn, !Sub "${ConsoleBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  ConsoleOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-console
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub EKS console (${AWS::StackName})
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: console
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsoleOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: console
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        # S3 answers a missing object (the page before its first upload) with
        # 403: show the kickoff's "being set up" page instead of S3 XML.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 503
            ResponsePagePath: /setup.html
            ErrorCachingMinTTL: 10
      Tags: [{ Key: eks-platform, Value: !Ref AWS::StackName }]

  # ------------------------------------------------------------ sign-in
  # Only admins added here can sign in (no self sign-up).
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: Cognito
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-admins
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your EKS console sign-in
          EmailMessage: !Sub >-
            Open https://${Distribution.DomainName}/ and sign in as {username}
            with the temporary password {####}. You choose your own password next.
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      UserPoolTags: { eks-platform: !Ref AWS::StackName }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: Cognito
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: Cognito
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: eks-console
      GenerateSecret: false # a browser page: public client, PKCE
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes }

  # ------------------------------------------------------------ API
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE]
        MaxAge: 600

  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: console-sign-in
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !If
          - Cognito
          - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
          - !Ref OidcIssuer
        Audience: [!If [Cognito, !Ref UserPoolClient, !Ref OidcClientId]]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  RouteList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /teams
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  RouteCreate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /teams
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  RouteGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /teams/{team}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  RoutePipelineKey:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /teams/{team}/pipeline-key
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  RouteDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: DELETE /teams/{team}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /eks/${AWS::StackName}/api-access
      RetentionInDays: 90

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","sub":"$context.authorizer.claims.sub","error":"$context.authorizer.error"}'

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 90

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      Description: EKS console API. Reads and writes team records, starts and reads runner builds.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: console-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogs.Arn}"
              - Sid: TeamRecords
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${Bucket.Arn}/teams/*"
              - Sid: ListTeams
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition: { StringLike: { s3:prefix: ["teams/*"] } }
              - Sid: Runner
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt Runner.Arn
              - Sid: RunnerLog
                Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub "${RunnerLogs.Arn}"
              # 'Show pipeline key (once)': an Azure DevOps team's pipeline key.
              - Sid: PipelineKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TeamPrefix}*-ado-sync-key-*

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Description: EKS console API (platform/api.py)
      Runtime: python3.12
      Handler: index.handler
      Timeout: 20
      MemorySize: 256
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          PROJECT: !Ref Runner
          ADMIN_CLAIM: !Ref AdminClaim
      Code:
        # code: platform/api.py
        ZipFile: |
          """EKS console API (Lambda behind API Gateway, JWT sign-in). Inlined into
          platform/eks-platform.yaml by platform/render.py; tests: tests/test_platform.py.

          Routes: GET /teams, POST /teams, GET /teams/{team}, DELETE /teams/{team},
          POST /teams/{team}/pipeline-key (an Azure DevOps team's pipeline key, shown once).
          Each call is logged as one JSON line (who, what, which team). A create or
          delete starts the CodeBuild runner (platform/runner.sh); this function only
          records the request and reads status, so it needs no rights on team stacks.
          """

          import json
          import os
          import re

          import boto3

          s3 = boto3.client("s3")
          cb = boto3.client("codebuild")
          sm = boto3.client("secretsmanager")
          logs = boto3.client("logs")
          BUCKET = os.environ["BUCKET"]
          PROJECT = os.environ["PROJECT"]
          ADMIN_CLAIM = os.environ.get("ADMIN_CLAIM", "")
          TEAM = re.compile(r"^[a-z][a-z0-9-]{0,18}[a-z0-9]$")
          RESERVED = ("console", "platform")


          def reply(code, body):
              return {
                  "statusCode": code,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(body, default=str),
              }


          def get(key):
              try:
                  return json.loads(s3.get_object(Bucket=BUCKET, Key=key)["Body"].read())
              except s3.exceptions.NoSuchKey:
                  return None


          def put(key, value):
              s3.put_object(
                  Bucket=BUCKET, Key=key, Body=json.dumps(value).encode(), ContentType="application/json"
              )


          def is_admin(claims):
              """ADMIN_CLAIM "name=value": the token must carry it (a group, a subject)."""
              if not ADMIN_CLAIM:
                  return True
              name, _, value = ADMIN_CLAIM.partition("=")
              have = str(claims.get(name, ""))
              return have == value or value in have.strip("[]").split()


          def start(team, action, who):
              env = [
                  {"name": k, "value": v, "type": "PLAINTEXT"}
                  for k, v in (("ACTION", action), ("TEAM", team))
              ]
              build = cb.start_build(projectName=PROJECT, environmentVariablesOverride=env)["build"]["id"]
              rec = {"team": team, "action": action, "build": build, "by": who, "status": "IN_PROGRESS"}
              put(f"teams/{team}/team.json", rec)
              return rec


          def with_status(recs):
              builds = cb.batch_get_builds(ids=[r["build"] for r in recs])["builds"] if recs else []
              by_id = {b["id"]: b for b in builds}
              for r in recs:
                  b = by_id.get(r["build"], {})
                  r.update(
                      status=b.get("buildStatus"), phase=b.get("currentPhase"), started=b.get("startTime")
                  )
              return recs


          def detail(rec):
              rec = with_status([rec])[0]
              b = cb.batch_get_builds(ids=[rec["build"]])["builds"][0].get("logs", {})
              if b.get("streamName"):
                  ev = logs.get_log_events(
                      logGroupName=b["groupName"], logStreamName=b["streamName"], limit=300
                  )
                  rec["log"] = [e["message"].rstrip() for e in ev["events"]]
              team = rec["team"]
              rec["result"] = get(f"teams/{team}/result.json")
              # The files the team commits (runner.sh repo-files.zip), as a 15-minute link.
              if rec["result"] and rec["result"].get("host") in ("ado", "github", "gitlab"):
                  rec["repoFiles"] = s3.generate_presigned_url(
                      "get_object",
                      Params={"Bucket": BUCKET, "Key": f"teams/{team}/repo-files.zip"},
                      ExpiresIn=900,
                  )
              # The filled Azure DevOps setup script (runner.sh), as its own download.
              if rec["result"] and rec["result"].get("adoSetup"):
                  rec["adoSetupScript"] = s3.generate_presigned_url(
                      "get_object",
                      Params={
                          "Bucket": BUCKET,
                          "Key": f"teams/{team}/ado-setup.sh",
                          "ResponseContentDisposition": f'attachment; filename="ado-setup-{team}.sh"',
                      },
                      ExpiresIn=900,
                  )
                  rec["pipelineKey"] = {k: v for k, v in (get(f"teams/{team}/key.json") or {}).items()}
              return rec


          def pipeline_key(team, who):
              """The pipeline key's secret, once: after that only a new team build makes another."""
              key = get(f"teams/{team}/key.json")
              if not key:
                  return reply(404, {"error": f"{team} has no pipeline key (not an Azure DevOps team)"})
              if key.get("shown"):
                  return reply(409, {"error": "the key was shown once already", "keyId": key["keyId"]})
              out = (get(f"teams/{team}/outputs.json") or {}).values()
              arn = next(
                  (o["AzureDevOpsSyncKeySecretArn"] for o in out if "AzureDevOpsSyncKeySecretArn" in o), ""
              )
              if not arn:
                  return reply(404, {"error": f"{team} has no pipeline key secret"})
              secret = sm.get_secret_value(SecretId=arn)["SecretString"]
              put(f"teams/{team}/key.json", {**key, "shown": True, "shownBy": who})
              return reply(200, {"keyId": key["keyId"], "secretAccessKey": secret})


          def handler(event, _context):
              claims = event["requestContext"]["authorizer"]["jwt"]["claims"]
              who = claims.get("email") or claims.get("sub")
              route = event["routeKey"]
              team = (event.get("pathParameters") or {}).get("team", "")
              body = event.get("body") or "{}"
              if route == "POST /teams":
                  try:
                      req = json.loads(body)
                  except ValueError:
                      req = {}
                  team = str(req.get("team", "")) if isinstance(req, dict) else ""
              admin = is_admin(claims)
              print(json.dumps({"route": route, "team": team, "who": who, "admin": admin}))
              if not admin:
                  return reply(403, {"error": "not an EKS admin"})
              if route == "GET /teams":
                  keys = s3.list_objects_v2(Bucket=BUCKET, Prefix="teams/").get("Contents", [])
                  recs = [get(k["Key"]) for k in keys if k["Key"].endswith("/team.json")]
                  return reply(200, with_status([r for r in recs if r]))
              if not TEAM.match(team) or team.startswith(RESERVED):
                  return reply(
                      400, {"error": "team: 2-20 lowercase letters, digits and -, starts with a letter"}
                  )
              rec = get(f"teams/{team}/team.json")
              if rec and with_status([rec])[0]["status"] == "IN_PROGRESS" and route != "GET /teams/{team}":
                  return reply(409, {"error": f"a build for {team} is running"})
              if route == "POST /teams":
                  if len(body) > 8000:
                      return reply(400, {"error": "request too large"})
                  put(f"teams/{team}/request.json", req)
                  return reply(202, start(team, "create", who))
              if not rec:
                  return reply(404, {"error": f"no team {team}"})
              if route == "GET /teams/{team}":
                  return reply(200, detail(rec))
              if route == "POST /teams/{team}/pipeline-key":
                  return pipeline_key(team, who)
              if route == "DELETE /teams/{team}":
                  return reply(202, start(team, "delete", who))
              return reply(404, {"error": "no such route"})

  ApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # ------------------------------------------------------------ runner
  RunnerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}-runner
      RetentionInDays: 90

  # What the team admin's installer role (path B,
  # factory/infra/customer/eks-installer-role.yaml) may do, for CodeBuild:
  # deploy only through the CDK roles, load content through each team
  # stack's own content role, clean up and scan its team prefix. Plus the
  # platform's own bucket, the console page, and the GitHub deploy role stack
  # add-team.sh makes for a GitHub team repo.
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-runner
      Description: EKS platform runner (CodeBuild). Installs and removes team stacks named after TeamPrefix.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
          # The team stacks' content roles trust this role (--ci-trust-role-arn);
          # assuming them is a call from this role to the role it trusts.
      Policies:
        - PolicyName: eks-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeCdkRoles
                Effect: Allow
                Action: [sts:AssumeRole, sts:TagSession]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*-${AWS::AccountId}-${AWS::Region}
              - Sid: AssumeContentRoles
                Effect: Allow
                Action: [sts:AssumeRole, sts:TagSession]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TeamPrefix}*ci-content*
              - Sid: CheckOwnPermissions
                Effect: Allow
                Action: [iam:GetRole, iam:SimulatePrincipalPolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-runner
              - Sid: Read
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:ListStacks
                  - bedrock:GetFoundationModelAvailability
                  - bedrock:ListKnowledgeBases
                  - bedrock:ListFoundationModels
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:ListGateways
                  - s3vectors:ListVectorBuckets
                  - s3:ListAllMyBuckets
                  - logs:DescribeLogGroups
                  - cognito-idp:ListUserPools
                  - iam:ListRoles
                  - iam:ListOpenIDConnectProviders
                Resource: "*"
              # AgentCore runtime log groups use the prefix with '_' (ekb_pr_x_kb-...).
              - Sid: CleanUpLogGroups
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*${TeamPrefix}*
                  - !Sub
                    - arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*${Under}*
                    - Under: !Join ["_", !Split ["-", !Ref TeamPrefix]]
              - Sid: CleanUpBuckets
                Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions, s3:DeleteObject, s3:DeleteObjectVersion, s3:DeleteBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${TeamPrefix}*
                  - !Sub arn:${AWS::Partition}:s3:::${TeamPrefix}*/*
              - Sid: CleanUpVectorBuckets
                Effect: Allow
                Action: [s3vectors:ListIndexes, s3vectors:DeleteIndex, s3vectors:DeleteVectorBucket]
                Resource: !Sub arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${TeamPrefix}*
              # uninstall.sh: a stack left DELETE_FAILED on its data source gets
              # it set to RETAIN, then deleted again (eks_install.unstick_data_source).
              # shortcut: knowledge base ARNs carry ids, not names, so this is
              # account-wide; scope it by tag when the stack tags its knowledge base.
              - Sid: UnstickDataSource
                Effect: Allow
                Action: [bedrock:GetDataSource, bedrock:UpdateDataSource]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              - Sid: UnstickDataSourceStack
                Effect: Allow
                Action: cloudformation:DescribeStackResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${TeamPrefix}*/*
              # The team prefix may match this stack's own names: never those.
              - Sid: KeepPlatform
                Effect: Deny
                Action: [s3:DeleteBucket, logs:DeleteLogGroup]
                Resource:
                  - !GetAtt Bucket.Arn
                  - !GetAtt ConsoleBucket.Arn
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*${AWS::StackName}*
              # add-team.sh --content https://github.com/...: the deploy role
              # the team repo's workflow assumes (cicd/github/deploy-role.yaml).
              - Sid: GitHubDeployRoleStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${TeamPrefix}*-github-deploy/*
              - Sid: GitHubDeployRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TeamPrefix}*-github-deploy
              # Azure DevOps teams: the pipeline user's key (platform/team.py key), and
              # its removal before a delete (scripts/eks_install.py delete_sync_keys).
              - Sid: AzureDevOpsSyncUserKeys
                Effect: Allow
                Action: [iam:ListAccessKeys, iam:DeleteAccessKey, iam:CreateAccessKey]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/eks-ado/${TeamPrefix}*
              - Sid: AzureDevOpsSyncKeySecret
                Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TeamPrefix}*-ado-sync-key-*
              - Sid: GitHubOidcProvider
                Effect: Allow
                Action: [iam:CreateOpenIDConnectProvider, iam:GetOpenIDConnectProvider, iam:TagOpenIDConnectProvider]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
              - Sid: PlatformRecords
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: [!Sub "${Bucket.Arn}/release/*", !Sub "${Bucket.Arn}/teams/*"]
              - Sid: PlatformList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Sid: ConsolePage
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "${ConsoleBucket.Arn}/*"
              - Sid: ConsoleList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ConsoleBucket.Arn
              - Sid: ConsoleCache
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
              # The first admin is invited by the runner once the page is live
              # (platform/runner.sh), so the invite link never opens an empty bucket.
              - !If
                - Cognito
                - Sid: InviteFirstAdmin
                  Effect: Allow
                  Action: [cognito-idp:AdminGetUser, cognito-idp:AdminCreateUser]
                  Resource: !GetAtt UserPool.Arn
                - !Ref AWS::NoValue
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RunnerLogs.Arn}"
      Tags: [{ Key: eks-platform, Value: !Ref AWS::StackName }]

  Runner:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-runner
      Description: EKS platform runner (platform/runner.sh) - console page, team installs and removals
      ServiceRole: !GetAtt RunnerRole.Arn
      TimeoutInMinutes: 90
      Artifacts: { Type: NO_ARTIFACTS }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref RunnerLogs }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false # no Docker: teams ship as code zips (--artifact code)
        EnvironmentVariables:
          - { Name: ACTION, Value: platform }
          - { Name: BUCKET, Value: !Ref Bucket }
          - { Name: CONSOLE_BUCKET, Value: !Ref ConsoleBucket }
          - !If [Cognito, { Name: USER_POOL_ID, Value: !Ref UserPool }, !Ref AWS::NoValue]
          - !If [Cognito, { Name: ADMIN_EMAIL, Value: !Ref AdminEmail }, !Ref AWS::NoValue]
          - { Name: DISTRIBUTION_ID, Value: !Ref Distribution }
          - { Name: TEAM_PREFIX, Value: !Ref TeamPrefix }
          - { Name: RUNNER_ROLE_ARN, Value: !GetAtt RunnerRole.Arn }
          - !If [HasRelease, { Name: RELEASE_URL, Value: !Ref ReleaseUrl }, !Ref AWS::NoValue]
          - !If [HasRelease, { Name: RELEASE_SHA256, Value: !Ref ReleaseSha256 }, !Ref AWS::NoValue]
          - Name: CONSOLE_SETTINGS
            Value: !Sub
              - '{"api": "${Api.ApiEndpoint}", "issuer": "${Issuer}", "clientId": "${ClientId}", "signIn": "${SignIn}", "teamPrefix": "${TeamPrefix}", "region": "${AWS::Region}"}'
              - Issuer: !If [Cognito, !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}", !Ref OidcIssuer]
                ClientId: !If [Cognito, !Ref UserPoolClient, !Ref OidcClientId]
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
                nodejs: 22
            build:
              commands:
                - |
                  set -euo pipefail
                  if [ "$ACTION" = platform ] && [ -n "${RELEASE_URL:-}" ]; then
                    curl --proto =https -fsSL -o /tmp/eks.tar.gz "$RELEASE_URL"
                    echo "$RELEASE_SHA256  /tmp/eks.tar.gz" | sha256sum -c -
                    aws s3 cp --only-show-errors /tmp/eks.tar.gz "s3://$BUCKET/release/eks.tar.gz"
                  fi
                  aws s3 cp --only-show-errors "s3://$BUCKET/release/eks.tar.gz" /tmp/eks.tar.gz
                  mkdir -p /tmp/eks
                  tar -xzf /tmp/eks.tar.gz -C /tmp/eks --strip-components=1
                  bash /tmp/eks/platform/runner.sh
      Tags: [{ Key: eks-platform, Value: !Ref AWS::StackName }]

  # ------------------------------------------------------------ kickoff
  KickoffLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-kickoff
      RetentionInDays: 30

  KickoffRole:
    Type: AWS::IAM::Role
    Properties:
      Description: EKS platform kickoff. Starts the console build, empties the platform buckets on delete.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kickoff
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${KickoffLogs.Arn}"
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt Runner.Arn
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: [!GetAtt Bucket.Arn, !GetAtt ConsoleBucket.Arn]
              - Effect: Allow
                Action: [s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: [!Sub "${Bucket.Arn}/*", !Sub "${ConsoleBucket.Arn}/*"]
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ConsoleBucket.Arn}/setup.html"

  KickoffFunction:
    Type: AWS::Lambda::Function
    DependsOn: KickoffLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-kickoff
      Description: EKS platform kickoff (platform/kickoff.py)
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt KickoffRole.Arn
      Code:
        # code: platform/kickoff.py
        ZipFile: |
          """Custom resource of platform/eks-platform.yaml (inlined by platform/render.py).

          Create / Update: put setup.html in the console bucket. CloudFront shows it
          for any missing object, so an early visit reads "being set up", not S3 XML.
          With a ReleaseUrl (quick-create link, or platform/install.sh when the release
          is published) also start the runner's "platform" build: it fetches and checks
          the release, publishes the console and invites the first admin, so the stack
          finishes the console even if CloudShell closes. Without one (a test bundle
          that is not published) install.sh uploads the bundle and starts that build.
          Delete: refuse while teams exist (their stacks would be left with no console
          to remove them), else empty both buckets so CloudFormation can delete them.
          """

          import json
          import urllib.request

          import boto3

          SETUP_PAGE = """<!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="30"><title>EKS console: being set up</title></head>
          <body style="font-family:sans-serif;max-width:40em;margin:4em auto">
          <h1>The EKS console is being set up</h1>
          <p>This takes about 10 minutes after the install starts. This page reloads by itself.</p>
          <p>Still here after 20 minutes? Run the install command in AWS CloudShell again.</p>
          </body></html>
          """


          def send(event, ok, reason=""):
              body = {
                  "Status": "SUCCESS" if ok else "FAILED",
                  "Reason": (reason or "see the function's log")[:900],
                  "PhysicalResourceId": event.get("PhysicalResourceId") or "eks-platform-kickoff",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }
              req = urllib.request.Request(  # noqa: S310 - the presigned CloudFormation URL
                  event["ResponseURL"],
                  data=json.dumps(body).encode(),
                  method="PUT",
                  headers={"content-type": ""},
              )
              urllib.request.urlopen(req, timeout=30)  # noqa: S310 - the presigned CloudFormation URL


          def teams(bucket):
              keys = [o.key for o in boto3.resource("s3").Bucket(bucket).objects.filter(Prefix="teams/")]
              return sorted({k.split("/")[1] for k in keys if k.endswith("/team.json")})


          def handler(event, _context):
              print(json.dumps({k: event.get(k) for k in ("RequestType", "LogicalResourceId")}))
              props = event["ResourceProperties"]
              try:
                  if event["RequestType"] == "Delete":
                      left = teams(props["Bucket"])
                      if left:
                          return send(
                              event, False, "Delete these teams in the EKS console first: " + ", ".join(left)
                          )
                      for name in (props["Bucket"], props["ConsoleBucket"]):
                          boto3.resource("s3").Bucket(name).object_versions.delete()
                      return send(event, True)
                  boto3.client("s3").put_object(
                      Bucket=props["ConsoleBucket"],
                      Key="setup.html",
                      Body=SETUP_PAGE.encode(),
                      ContentType="text/html",
                      CacheControl="no-cache",
                  )
                  if props.get("ReleaseUrl"):
                      boto3.client("codebuild").start_build(
                          projectName=props["Project"],
                          environmentVariablesOverride=[
                              {"name": "ACTION", "value": "platform", "type": "PLAINTEXT"}
                          ],
                      )
                  return send(event, True)
              except Exception as exc:  # noqa: BLE001 - any failure must reach CloudFormation
                  print(repr(exc))
                  return send(event, False, str(exc))

  # Made last and deleted first: it depends on the whole console, so on
  # stack delete its refusal (teams still exist) keeps the console working.
  Kickoff:
    Type: Custom::EksPlatformKickoff
    DependsOn:
      - KickoffLogs
      - ConsoleBucketPolicy
      - BucketTls
      - RunnerLogs
      - Distribution
      - ApiStage
      - ApiInvoke
      - ApiLogs
      - RouteList
      - RouteCreate
      - RouteGet
      - RouteDelete
    Properties:
      ServiceToken: !GetAtt KickoffFunction.Arn
      SignInClient: !If [Cognito, !Ref UserPoolClient, !Ref OidcClientId]
      Bucket: !Ref Bucket
      ConsoleBucket: !Ref ConsoleBucket
      Project: !Ref Runner
      ReleaseUrl: !Ref ReleaseUrl
      ReleaseSha256: !Ref ReleaseSha256

Outputs:
  ConsoleUrl:
    Description: The EKS console. Sign in, then Add team.
    Value: !Sub https://${Distribution.DomainName}/
  ApiUrl:
    Value: !GetAtt Api.ApiEndpoint
  Bucket:
    Description: Release bundle and team records.
    Value: !Ref Bucket
  RunnerProject:
    Value: !Ref Runner
  RunnerRoleArn:
    Description: The team stacks' content roles trust this role.
    Value: !GetAtt RunnerRole.Arn
  ApiFunctionName:
    Value: !Ref ApiFunction
