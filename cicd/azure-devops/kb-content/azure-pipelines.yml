# Generated by cicd/azure-devops/setup_azure_devops.py from deployment.json.
#
# Syncs this repository's markdown into the knowledge base.
#
# Domain teams own the documents in knowledge-base/. The steps live in the
# platform team's kb-pipelines repository; this file only says which template
# to use and which source this repository is.
trigger:
  branches:
    include: [main]
  paths:
    include: [knowledge-base/*, mcp/*]

# Pull requests are validated by a branch policy on main, not a pr trigger.
pr: none

resources:
  repositories:
    - repository: kb-pipelines
      type: git
      name: __PROJECT__/kb-pipelines
      ref: refs/heads/main

extends:
  template: templates/kb-sync.yml@kb-pipelines
  parameters:
    sourceId: __SOURCE_ID__
